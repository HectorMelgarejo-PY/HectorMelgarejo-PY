# Dibuja la serpiente que recorre el gráfico de contribuciones y la publica en
# la rama `output`, de donde la toma el README. Corre una vez por día.
name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpiente.svg?color_snake=#2563EB
            dist/serpiente-oscuro.svg?palette=github-dark&color_snake=#60A5FA

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
