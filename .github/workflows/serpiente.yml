# Dibuja la serpiente que recorre el gráfico de contribuciones y la publica en
# la rama `output`, de donde la toma el README. Corre una vez por día.
name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpiente.svg?color_snake=#EFA087&color_dots=#ebedf0,#c6dafe,#93b8fc,#5d94fb,#0070ed
            dist/serpiente-oscuro.svg?palette=github-dark&color_snake=#EFA087&color_dots=#161b22,#1c3a75,#2f5fb8,#5d94fb,#a9c6fd

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
